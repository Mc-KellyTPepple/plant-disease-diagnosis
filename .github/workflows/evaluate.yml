name: Field-photo evaluation

# Runs the deployed model on the PlantDoc test split and commits evaluation.json. Run it by hand from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install onnxruntime numpy Pillow
      - name: Fetch PlantDoc test split
        run: |
          git clone --depth 1 --filter=blob:none --sparse https://github.com/pratikkayal/PlantDoc-Dataset plantdoc
          git -C plantdoc sparse-checkout set test
      - run: python evaluate_plantdoc.py plantdoc/test
      - name: Commit results
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add evaluation.json
          git diff --cached --quiet || git commit -m "Field-photo evaluation"
          git pull --rebase -X theirs && git push
